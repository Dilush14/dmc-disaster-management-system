spring.application.name=dmc
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://127.0.0.1:8081}
app.firebase.enabled=${FIREBASE_ENABLED:false}
app.firebase.project-id=${FIREBASE_PROJECT_ID:}
app.firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:}
app.cloudinary.enabled=${CLOUDINARY_ENABLED:false}
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
spring.jackson.deserialization.fail-on-unknown-properties=true
# Disable development password generation; no login mechanism is enabled yet.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
app.notifications.email.enabled=${NOTIFICATIONS_EMAIL_ENABLED:false}
app.notifications.email.api-key=${BREVO_API_KEY:}
app.notifications.email.sender=${NOTIFICATIONS_EMAIL_SENDER:}
app.notifications.sms.enabled=${NOTIFICATIONS_SMS_ENABLED:false}
app.notifications.sms.account-sid=${TWILIO_ACCOUNT_SID:}
app.notifications.sms.auth-token=${TWILIO_AUTH_TOKEN:}
app.notifications.sms.from=${TWILIO_FROM_NUMBER:}
